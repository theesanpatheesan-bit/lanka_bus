name: lanka_bus
description: Bus Booking & Fleet Management Platform for Sri Lanka
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7

  # Backend / networking
  supabase_flutter: ^2.9.1
  dio: ^5.8.0+1

  # Maps & location
  google_maps_flutter: ^2.12.2

  # UI / formatting
  google_fonts: ^6.2.1
  intl: ^0.20.2

  # Utilities
  uuid: ^4.5.1
  flutter_dotenv: ^5.2.1

  # Navigation
  go_router: ^15.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - .env
